# Nginx per app — melayani static file dari image web (stage "web"
# di Dockerfile.prod) dan meneruskan PHP ke service php-fpm proyek ini.
# Host "app" di bawah adalah nama service pada network internal proyek
# (bukan network bersama), jadi tidak bentrok dengan app lain.
server {
    listen 80;
    server_name _;
    root /var/www/html/public;

    index index.php;
    charset utf-8;

    # Batas upload menyamakan php.ini prod (post 10M).
    client_max_body_size 10M;

    # File sensitif tidak pernah dilayani, apa pun yang terjadi.
    location ~ /\.(?!well-known).* {
        deny all;
    }
    location ~* /(composer\.(json|lock)|package(-lock)?\.json|\.env.*|artisan)$ {
        deny all;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 60s;
    }

    # Aset hasil build Vite: aman di-cache lama karena nama file ber-hash.
    location /build/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
