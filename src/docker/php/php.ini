; Konfigurasi PHP production untuk VPS 2 GB.
; Nilai upload menyamakan batas fase 3 ramz-app (public/.user.ini di dev:
; upload 8M / post 10M — PHP bawaan hanya 2M).
memory_limit = 256M
max_execution_time = 60
upload_max_filesize = 8M
post_max_size = 10M
expose_php = Off
display_errors = Off
log_errors = On
date.timezone = Asia/Jakarta

; OPcache: wajib di production. validate_timestamps=0 berarti perubahan
; kode hanya berlaku setelah container di-restart / image di-deploy ulang —
; itulah perilaku yang diinginkan di prod (bukan alasan menonaktifkannya).
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 10000
opcache.validate_timestamps = 0
opcache.revalidate_freq = 0
opcache.save_comments = 1
