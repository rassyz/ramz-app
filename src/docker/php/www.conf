; Pool PHP-FPM untuk VPS 2 GB — NILAI DASAR untuk 1 app aktif.
; Sesuaikan pm.max_children mengikuti jumlah app aktif di VPS yang sama:
;   1 app aktif  -> max_children = 8 (file ini)
;   2 app aktif  -> max_children = 5
;   3 app aktif  -> max_children = 4 (mode sesak, lihat plan D11)
; Perkiraan: 1 child rata-rata 60-80 MB, jadi 8 child +- 500-600 MB
; dan keras dibatasi mem_limit 512m pada service app di compose.
[www]
user = www-data
group = www-data
listen = 9000

pm = dynamic
pm.max_children = 8
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
pm.max_requests = 500

; Status & ping untuk healthcheck/monitoring ringan.
pm.status_path = /fpm-status
ping.path = /fpm-ping

catch_workers_output = yes
clear_env = no
